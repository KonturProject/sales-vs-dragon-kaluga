<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Оплаты группы — Победи дракона</title>
  <script type="module" crossorigin src="./assets/rg-DkP7sVol.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/Units-CJB2CyT7.js">
  <link rel="modulepreload" crossorigin href="./assets/paymentEntry-BDStODP9.js">
  <link rel="stylesheet" crossorigin href="./assets/paymentEntry-DZshOmRr.css">
</head>
<body>
    <div class="scene-glow"></div>
    <div class="admin-card rg-card">
        <div class="eyebrow">Победи дракона · Калуга</div>
        <h1 id="title">Оплаты группы</h1>

        <form id="pin-form" onsubmit="event.preventDefault()">
            <label for="pin">PIN-код CEO группы</label>
            <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••••" required />
            <button type="submit">Войти<span class="btn-arrow">→</span></button>
        </form>

        <div id="panel" hidden>
            <p id="rg-date" class="current-status"></p>
            <div id="rg-counter"></div>
            <p class="hint">Введите сумму из платёжки. После сохранения герой ударит дракона, и можно будет внести следующую оплату.</p>
            <button type="button" id="logout" class="ghost logout">Выйти</button>
        </div>

        <p id="status" role="status"></p>
    </div>

</body>
</html>
